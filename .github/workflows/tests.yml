name: Verify equations and frozen experiment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorded NumPy and plotting dependencies
        run: python -m pip install 'numpy==2.3.5' 'matplotlib>=3.7,<4'
      - name: Check equations, drift, data access and costs
        run: python -m unittest discover -s tests -v
      - name: Reproduce every frozen result
        run: python experiment.py --verify results/receipt.json
